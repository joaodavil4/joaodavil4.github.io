# Shown on the home page, in this order. `slug` is the folder name; keep it stable,
# shipped builds and store listings link to /<slug>/privacy/ and /<slug>/support/.
# Apps hosted elsewhere set `url` (with trailing slash) instead; the card links to
# <url>, <url>support and <url>privacy there, and `icon` points at a PNG in assets/icons.
